name: weekly-train

on:
  schedule:
    - cron: '0 12 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open-train-pr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: open dev to main pr if dev is ahead
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          ahead=$(git rev-list --count origin/main..origin/dev)
          if [ "$ahead" -eq 0 ]; then
            echo "dev is not ahead of main, no train this week"
            exit 0
          fi
          open=$(gh pr list --base main --head dev --state open --json number --jq 'length')
          if [ "$open" -gt 0 ]; then
            echo "train PR already open"
            exit 0
          fi
          {
            echo "This week's train ($ahead commits):"
            echo
            git log --oneline --no-merges origin/main..origin/dev | sed 's/^/- /'
            echo
            echo "Merge with a merge commit, never squash."
          } > pr-body.md
          gh pr create --base main --head dev --title "chore: weekly release train" --body-file pr-body.md
