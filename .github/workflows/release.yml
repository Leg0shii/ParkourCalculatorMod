name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdks
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            8
            21

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: list loader targets
        id: targets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          all=$(for dir in loader-*/versions/*/; do
            tree=${dir%%/*}
            echo "${tree#loader-}/$(basename "$dir")"
          done)
          only=''
          if [ -f .github/release-targets.json ] && [ "$(jq -r .version .github/release-targets.json)" = "$VERSION" ]; then
            only=$(jq -r '.targets[]' .github/release-targets.json)
            echo "release-targets.json restricts $VERSION to:" $only
          fi
          targets=$(echo "$all" | while read -r t; do
            if [ -z "$only" ] || echo "$only" | grep -qx "$t"; then echo "$t"; fi
          done)
          [ -n "$targets" ] || { echo "no loader target left to release"; exit 1; }
          echo "$targets"
          echo "targets=$(echo "$targets" | jq -R '{loader: split("/")[0], mc: split("/")[1]}' | jq -cs '{include: .}')" >> "$GITHUB_OUTPUT"
          if [ -z "$only" ]; then
            echo "tasks=build" >> "$GITHUB_OUTPUT"
          else
            echo "tasks=:core:build $(echo "$targets" | sed 's#^#:loader-#; s#/#:#; s#$#:build#' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: build
        run: ./gradlew ${{ steps.targets.outputs.tasks }} -x tableStyleCheck -PslowTests -PreleaseVersion=${{ steps.version.outputs.version }} -Dorg.gradle.java.home="$JAVA_HOME"

      - name: collect jars
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          mkdir -p release-jars
          echo "$TARGETS" | jq -r '.include[] | "loader-\(.loader)/versions/\(.mc)/build/libs/pkc-\(.loader)-\(.mc)-'"$VERSION"'.jar"' | while read -r jar; do
            cp "$jar" release-jars/
          done
          ls -l release-jars

      - name: upload jars
        uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: release-jars/*.jar

      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          files: release-jars/*.jar
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build.outputs.targets) }}
    name: publish ${{ matrix.loader }} ${{ matrix.mc }} to modrinth
    steps:
      - name: download jars
        uses: actions/download-artifact@v4
        with:
          name: release-jars
          path: release-jars

      - name: fetch release changelog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release view "$GITHUB_REF_NAME" --json body --jq .body > changelog.md

      - name: publish to modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: Lxy4H4lS
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release-jars/pkc-${{ matrix.loader }}-${{ matrix.mc }}-${{ needs.build.outputs.version }}.jar
          name: ${{ needs.build.outputs.version }} (${{ matrix.loader == 'fabric' && 'Fabric' || 'Forge' }} ${{ matrix.mc }})
          version: ${{ needs.build.outputs.version }}
          version-type: ${{ contains(github.ref_name, '-') && 'beta' || 'release' }}
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.mc }}
          changelog-file: changelog.md
