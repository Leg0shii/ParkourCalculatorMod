name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdks
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            8
            21

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: list loader targets
        id: targets
        run: |
          targets=$(for dir in loader-*/versions/*/; do
            tree=${dir%%/*}
            printf '{"loader":"%s","mc":"%s"}\n' "${tree#loader-}" "$(basename "$dir")"
          done | jq -cs '{include: .}')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      - name: build
        run: ./gradlew build -x tableStyleCheck -PslowTests -PreleaseVersion=${{ steps.version.outputs.version }} -Dorg.gradle.java.home="$JAVA_HOME"

      - name: collect jars
        run: |
          mkdir -p release-jars
          cp loader-*/versions/*/build/libs/pkc-*-${{ steps.version.outputs.version }}.jar release-jars/
          ls -l release-jars

      - name: upload jars
        uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: release-jars/*.jar

      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          files: release-jars/*.jar
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build.outputs.targets) }}
    name: publish ${{ matrix.loader }} ${{ matrix.mc }} to modrinth
    steps:
      - name: download jars
        uses: actions/download-artifact@v4
        with:
          name: release-jars
          path: release-jars

      - name: fetch release changelog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release view "$GITHUB_REF_NAME" --json body --jq .body > changelog.md

      - name: publish to modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: Lxy4H4lS
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release-jars/pkc-${{ matrix.loader }}-${{ matrix.mc }}-${{ needs.build.outputs.version }}.jar
          name: ${{ needs.build.outputs.version }} (${{ matrix.loader == 'fabric' && 'Fabric' || 'Forge' }} ${{ matrix.mc }})
          version: ${{ needs.build.outputs.version }}
          version-type: ${{ contains(github.ref_name, '-') && 'beta' || 'release' }}
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.mc }}
          changelog-file: changelog.md
