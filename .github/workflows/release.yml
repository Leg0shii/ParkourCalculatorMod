name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdks
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            8
            21

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: build
        run: ./gradlew build -x tableStyleCheck -PslowTests -PreleaseVersion=${{ steps.version.outputs.version }} -Dorg.gradle.java.home="$JAVA_HOME"

      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            loader-fabric/build/libs/pkc-fabric-${{ steps.version.outputs.version }}.jar
            loader-forge-1.8.9/build/libs/pkc-forge-1.8.9-${{ steps.version.outputs.version }}.jar
            loader-forge-1.12.2/build/libs/pkc-forge-1.12.2-${{ steps.version.outputs.version }}.jar
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: fetch release changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" --json body --jq .body > changelog.md

      - name: publish fabric to modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: Lxy4H4lS
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: loader-fabric/build/libs/pkc-fabric-${{ steps.version.outputs.version }}.jar
          name: ${{ steps.version.outputs.version }} (Fabric)
          version: ${{ steps.version.outputs.version }}
          version-type: ${{ contains(github.ref_name, '-') && 'beta' || 'release' }}
          loaders: fabric
          game-versions: '26.2'
          changelog-file: changelog.md

      - name: publish forge 1.8.9 to modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: Lxy4H4lS
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: loader-forge-1.8.9/build/libs/pkc-forge-1.8.9-${{ steps.version.outputs.version }}.jar
          name: ${{ steps.version.outputs.version }} (Forge 1.8.9)
          version: ${{ steps.version.outputs.version }}
          version-type: ${{ contains(github.ref_name, '-') && 'beta' || 'release' }}
          loaders: forge
          game-versions: '1.8.9'
          changelog-file: changelog.md

      - name: publish forge 1.12.2 to modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: Lxy4H4lS
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: loader-forge-1.12.2/build/libs/pkc-forge-1.12.2-${{ steps.version.outputs.version }}.jar
          name: ${{ steps.version.outputs.version }} (Forge 1.12.2)
          version: ${{ steps.version.outputs.version }}
          version-type: ${{ contains(github.ref_name, '-') && 'beta' || 'release' }}
          loaders: forge
          game-versions: '1.12.2'
          changelog-file: changelog.md
