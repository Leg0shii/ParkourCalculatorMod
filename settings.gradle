pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'WagYourMaven'
			url = 'https://maven.wagyourtail.xyz/releases'
		}
		maven {
			name = 'ForgeMaven'
			url = 'https://maven.minecraftforge.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
	id 'dev.kikugie.stonecutter' version '0.9.8'
}

rootProject.name = 'parkourcalculator'
include 'core'
include 'forge-core'
include 'gpu'

stonecutter {
	create('loader-fabric') {
		versions '26.3', '1.21.3', '1.20.4'
		vcsVersion = '26.3'
	}
	create('loader-forge') {
		versions '1.12.2', '1.8.9'
		vcsVersion = '1.12.2'
	}
}
