plugins {
	id 'java-library'
}

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
	options.release = 8
	options.encoding = 'UTF-8'
}

repositories {
	mavenCentral()
}

dependencies {
	// imgui-java compileOnly so core can call ImGui APIs without bundling natives.
	// Every loader bundles 1.86.12 at runtime (the koxx12-dev LWJGL2 shim the Forge loaders
	// use was built against 1.86.11, whose native surface is a strict subset of 1.86.12), so
	// core compiles and runs against one version everywhere. 1.86.12 is the first release whose
	// macOS native is a universal binary (x86_64 + arm64); 1.86.11 was x86_64-only and crashed
	// Apple Silicon. Keep core within the 1.86.11 API subset; do not bump above what loaders bundle.
	compileOnly 'io.github.spair:imgui-java-binding:1.86.12'

	// Gson is shipped by every Minecraft client we target (Forge 1.8.9 ships 2.2.4,
	// Forge 1.12.2 ships ~2.8.0, Fabric 26.2 ships 2.10+). Declared compileOnly so
	// core does not bundle its own copy; usage is restricted to the API subset present
	// in 2.2.4 (no JsonParser.parseReader, no JsonArray.add(Number) sugar).
	compileOnly 'com.google.code.gson:gson:2.8.0'

	// commons-math3 is test-only since the bespoke TrustRegionLp replaced the SimplexSolver in
	// SlpSolve: TrustRegionLpTest keeps it as the randomized equivalence oracle. No loader bundles
	// it any more, so it must never be promoted out of the test source set.
	testImplementation 'org.apache.commons:commons-math3:3.6.1'

	// Test-only. Gson is compileOnly for main (the loaders provide it), so the test source set needs
	// its own copy; pin to the 2.8.0 API the save layer is written against. JUnit 4 keeps the runner
	// simple on the Java 8 toolchain.
	testImplementation 'com.google.code.gson:gson:2.8.0'
	testImplementation 'junit:junit:4.13.2'
	// The binding's plain-Java classes (ImString buffers etc.) so tests can construct UI classes
	// whose logic is render-free (e.g. FileMenu auto-save); nothing native is loaded.
	testImplementation 'io.github.spair:imgui-java-binding:1.86.12'
}

sourceSets {
	research {
		compileClasspath += sourceSets.main.output + sourceSets.test.output
		runtimeClasspath += sourceSets.main.output + sourceSets.test.output
	}
}

configurations {
	researchImplementation.extendsFrom testImplementation
	researchRuntimeOnly.extendsFrom testRuntimeOnly
}

def problemCases() {
	def out = []
	file('src/test/resources/problems').listFiles().findAll { it.directory }.sort { it.name }.each { d ->
		def names = new TreeSet<String>()
		d.listFiles().each { f ->
			if (f.name.endsWith('.expect.json')) names << f.name[0..-13]
			else if (f.name.endsWith('.json')) names << f.name[0..-6]
		}
		names.each { out << d.name + '/' + it }
	}
	out
}

def loadTestWeights() {
	def weights = [:]
	def weightsFile = file('test-weights.properties')
	if (weightsFile.exists()) {
		weightsFile.eachLine { line ->
			def s = line.trim()
			if (s.isEmpty() || s.startsWith('#')) return
			def i = s.lastIndexOf('=')
			weights[s.substring(0, i)] = s.substring(i + 1).toDouble()
		}
	}
	weights
}

def testClasses() {
	def out = []
	def srcRoot = file('src/test/java')
	fileTree(srcRoot).matching { include '**/*.java' }.each { f ->
		def text = f.text
		if (!text.contains('@Test')) return
		def cls = srcRoot.toPath().relativize(f.toPath()).toString().replace(File.separatorChar, '.' as char)
		out << [name: cls[0..-6], verySlow: text.contains('VerySlowSolverTests.class'), slow: (text =~ /(?<!Very)SlowSolverTests\.class/).find()]
	}
	out
}

def splitClasses() {
	['de.legoshi.parkourcalc.anglesolver.YawDirectionCrossCheckTest': 8]
}

def testShardPlan(int shardCount) {
	def slow = project.hasProperty('slowTests')
	def verySlow = project.hasProperty('verySlowTests')
	def weights = loadTestWeights()
	def split = splitClasses()
	def items = []
	testClasses().each { c ->
		if (!verySlow && c.verySlow) return
		if (!slow && c.slow) return
		def unmeasured = c.verySlow ? 600.0d : 1.0d
		if (c.name.endsWith('.ProblemsTest')) {
			problemCases().each { items << [name: c.name + '#' + it, weight: weights.get(c.name + '#' + it, 1.0d)] }
		} else if (split.containsKey(c.name)) {
			int parts = split[c.name]
			(0..<parts).each { items << [name: c.name + '@' + it, weight: weights.get(c.name, unmeasured) / parts] }
		} else {
			items << [name: c.name, weight: weights.get(c.name, unmeasured)]
		}
	}
	items.sort { a, b -> b.weight <=> a.weight ?: a.name <=> b.name }
	def shards = (0..<shardCount).collect { [items: [], weight: 0.0d] }
	items.each { item ->
		def target = shards.min { it.weight }
		target.items << item
		target.weight += item.weight
	}
	shards
}

def configureTestShard(Test t) {
	def spec = project.findProperty('pkcShard')
	if (spec == null) return
	def parts = spec.toString().split('/')
	def shard = testShardPlan(parts[1] as int)[parts[0] as int]
	def classes = new HashSet<String>()
	def problems = []
	def splitParts = [:]
	shard.items.each {
		def hash = it.name.indexOf('#')
		def at = it.name.indexOf('@')
		if (at >= 0) {
			def cls = it.name.substring(0, at)
			classes << cls
			if (!splitParts.containsKey(cls)) splitParts[cls] = []
			splitParts[cls] << it.name.substring(at + 1)
		} else if (hash < 0) {
			classes << it.name
		} else {
			classes << it.name.substring(0, hash)
			problems << it.name.substring(hash + 1)
		}
	}
	t.include { FileTreeElement e ->
		e.directory || classes.contains(e.path.replace('/', '.').replaceAll(/\.class$/, '').replaceAll(/\$.*/, ''))
	}
	if (!problems.isEmpty()) t.systemProperty 'pkc.problems', problems.join(',')
	def split = splitClasses()
	splitParts.each { cls, list ->
		t.systemProperty 'pkc.parts.' + cls.substring(cls.lastIndexOf('.') + 1), list.join(',') + '/' + split[cls]
	}
}

tasks.register('testShardPlan') {
	group = 'verification'
	description = 'Prints how -PpkcShard=i/n splits the core tests across CI jobs (weights from test-weights.properties).'
	doLast {
		def spec = (project.findProperty('pkcShard') ?: '0/8').toString()
		def count = spec.split('/')[1] as int
		testShardPlan(count).eachWithIndex { s, i ->
			println "shard ${i}/${count}: ${Math.round(s.weight)} s, ${s.items.size()} items"
			s.items.findAll { it.weight >= 5 }.each { println "    ${Math.round(it.weight)} s  ${it.name}" }
		}
	}
}

tasks.register('testWeights') {
	group = 'verification'
	description = 'Updates test-weights.properties from the test results under -PpkcResults (default build/test-results/test); entries the run did not measure are kept, entries for removed tests are dropped.'
	doLast {
		def known = new HashSet<String>()
		def verySlowClasses = new HashSet<String>()
		testClasses().each { c ->
			if (c.verySlow) verySlowClasses << c.name
			if (c.name.endsWith('.ProblemsTest')) {
				problemCases().each { known << c.name + '#' + it }
			} else {
				known << c.name
			}
		}
		def rows = loadTestWeights().findAll { k, v -> known.contains(k) }
		def split = splitClasses()
		def splitTimes = [:]
		def measured = { String key, double t, boolean keepShort ->
			if (!known.contains(key)) return
			if (keepShort) {
				rows[key] = Math.max(t, 1.0d)
			} else if (t >= 0.5) {
				rows[key] = t
			} else {
				rows.remove(key)
			}
		}
		def results = project.findProperty('pkcResults') ?: 'build/test-results/test'
		fileTree(results).matching { include '**/*.xml' }.each { f ->
			def suite = new groovy.xml.XmlSlurper().parse(f)
			def name = suite.@name.text()
			if (name.endsWith('.ProblemsTest')) {
				suite.testcase.each { c ->
					measured(name + '#' + c.@name.text()[6..-2], c.@time.text().toDouble(), false)
				}
			} else if (split.containsKey(name)) {
				splitTimes[name] = (splitTimes[name] ?: 0.0d) + suite.@time.text().toDouble()
			} else {
				measured(name, suite.@time.text().toDouble(), verySlowClasses.contains(name))
			}
		}
		splitTimes.each { name, t -> measured(name, t, verySlowClasses.contains(name)) }
		def sorted = rows.sort { a, b -> b.value <=> a.value ?: a.key <=> b.key }
		file('test-weights.properties').text = sorted.collect { k, v -> "${k}=${Math.round(v)}" }.join('\n') + '\n'
	}
}

tasks.named('test') {
	systemProperties providers.systemPropertiesPrefixedBy('pkc.').get()
	configureTestShard(it)
	useJUnit {
		if (!project.hasProperty('slowTests')) {
			excludeCategories 'de.legoshi.parkourcalc.SlowSolverTests'
		}
		if (!project.hasProperty('verySlowTests')) {
			excludeCategories 'de.legoshi.parkourcalc.VerySlowSolverTests'
		}
	}
	if (project.hasProperty('testCpus')) {
		jvmArgs "-XX:ActiveProcessorCount=${project.property('testCpus')}"
	}
	if (project.hasProperty('pkcJfr')) {
		jvmArgs "-XX:StartFlightRecording=filename=${project.property('pkcJfr')},settings=profile,dumponexit=true", "-XX:FlightRecorderOptions=stackdepth=512"
	}
}

tasks.register('testJava8', Test) {
	group = 'verification'
	description = 'Runs the core tests on a Java 8 runtime, the JVM the Forge loaders ship on.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	javaLauncher.set(javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(8)
	})
	configureTestShard(it)
	systemProperties providers.systemPropertiesPrefixedBy('pkc.').get()
	useJUnit {
		if (!project.hasProperty('slowTests')) {
			excludeCategories 'de.legoshi.parkourcalc.SlowSolverTests'
		}
		if (!project.hasProperty('verySlowTests')) {
			excludeCategories 'de.legoshi.parkourcalc.VerySlowSolverTests'
		}
	}
	if (project.hasProperty('testCpus')) {
		jvmArgs "-XX:ActiveProcessorCount=${project.property('testCpus')}"
	}
}

tasks.register('research', Test) {
	group = 'verification'
	description = 'Runs the env-gated research tools (probes, dumps, screens, benches) from src/research; pick one with --tests.'
	testClassesDirs = sourceSets.research.output.classesDirs
	classpath = sourceSets.research.runtimeClasspath
	systemProperties providers.systemPropertiesPrefixedBy('pkc.').get()
	useJUnit()
	outputs.upToDateWhen { false }
	if (project.hasProperty('testCpus')) {
		jvmArgs "-XX:ActiveProcessorCount=${project.property('testCpus')}"
	}
	if (project.hasProperty('pkcJfr')) {
		jvmArgs "-XX:StartFlightRecording=filename=${project.property('pkcJfr')},settings=profile,dumponexit=true", "-XX:FlightRecorderOptions=stackdepth=512"
	}
}

tasks.register('printResearchClasspath') {
	group = 'help'
	description = 'Prints the research runtime classpath for a direct java -cp run.'
	dependsOn 'researchClasses'
	doLast {
		println sourceSets.research.runtimeClasspath.asPath
	}
}

// Enforce the table-styling consolidation rules established in the Phase 1-5
// refactor. Three checks, each a simple regex over the ImGui rendering tree.
// See CONTRIBUTING.md "Table styling" for the contract; this task is the gate.
tasks.register('tableStyleCheck') {
	group = 'verification'
	description = 'Reject direct ImGui table styling outside ThemeManager.'

	def renderingRoot = file('src/main/java/de/legoshi/parkourcalc/core/ui')
	def themeManager = new File(renderingRoot, 'theme/ThemeManager.java').canonicalPath
	def settingsModal = new File(renderingRoot, 'SettingsModal.java').canonicalPath
	def themeDir = new File(renderingRoot, 'theme').canonicalPath

	// Configuration-cache friendly: declare inputs explicitly.
	inputs.dir(renderingRoot).withPropertyName('renderingTree').withPathSensitivity(PathSensitivity.RELATIVE)

	doLast {
		def violations = []

		// Patterns. The pushStyleColor regex tolerates whitespace and matches
		// either single-arg packed-int form or the multi-arg float form, since
		// both can be used to push the slot. The beginTable regex matches the
		// ImGui.beginTable call regardless of arity. The hex regex catches the
		// 8-digit RGBA / ARGB shape that color constants tend to take.
		def pushPattern = ~/pushStyleColor\s*\(\s*ImGuiCol\.(TableHeaderBg|TableBorderStrong|TableBorderLight|TableRowBg|TableRowBgAlt)\b/
		def beginTablePattern = ~/ImGui\.beginTable\s*\(/
		def hexPattern = ~/\b0x[0-9a-fA-F]{8}\b/
		def imVec4Pattern = ~/new\s+ImVec4\s*\(\s*-?\d+(\.\d+)?[fF]?\s*,\s*-?\d+(\.\d+)?[fF]?\s*,\s*-?\d+(\.\d+)?[fF]?\s*,\s*-?\d+(\.\d+)?[fF]?\s*\)/

		renderingRoot.eachFileRecurse { f ->
			if (!f.name.endsWith('.java')) return
			def canonical = f.canonicalPath
			def isThemeManager = canonical == themeManager
			def isSettingsModal = canonical == settingsModal
			def isInThemeDir = canonical.startsWith(themeDir + File.separator) || canonical == themeManager
			def relative = renderingRoot.toPath().relativize(f.toPath()).toString().replace('\\', '/')

			f.eachLine('UTF-8') { line, lineNum ->
				if (!isThemeManager && (line =~ pushPattern)) {
					violations << "[CHECK 1] ui/${relative}:${lineNum}  table-related pushStyleColor outside ThemeManager"
				}
				if (!isThemeManager && !isSettingsModal && (line =~ beginTablePattern)) {
					violations << "[CHECK 2] ui/${relative}:${lineNum}  direct ImGui.beginTable; use ThemeManager.beginStandard*Table"
				}
				if (!isInThemeDir) {
					if (line =~ hexPattern) {
						violations << "[CHECK 3] ui/${relative}:${lineNum}  8-digit hex color literal in rendering code; define the color in ThemeManager"
					}
					if (line =~ imVec4Pattern) {
						violations << "[CHECK 3] ui/${relative}:${lineNum}  numeric ImVec4 constructor in rendering code; define the color in ThemeManager"
					}
				}
			}
		}

		if (!violations.isEmpty()) {
			def msg = new StringBuilder('Table-styling rule violations:\n')
			violations.each { msg.append('  ').append(it).append('\n') }
			msg.append('\nSee CONTRIBUTING.md "Table styling" for the full contract.')
			throw new GradleException(msg.toString())
		}
	}
}

tasks.named('check') { dependsOn 'tableStyleCheck', 'researchClasses' }
